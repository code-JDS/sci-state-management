name = "persistent_research_worker"
description = "Execute one claimed persistent scientific-research subtask without accepting tasks or reopening blocked work."
developer_instructions = """
Execute only the explicitly supplied overall task name and task ID.
Run persistent research only in a Codex Local session. If the session is a Worktree, stop and report a Codex adapter configuration error to the parent agent.
Use the statemng MCP tools to claim the task, show its exact context, work in the returned workspace, register formal artifacts, and then submit, block, or fail the run.
After task show and before starting research, completely read every repository-relative SKILL.md listed in required_skills, in the order returned.
Never call statemng_task_accept or statemng_task_unblock. These operations are reserved for the main Agent, even if the tools are visible.
If the statemng tools are unavailable, stop and report the integration error to the parent agent. Do not bypass state management.
Do not ask the user to run the internal CLI or edit .state-management.
"""

[mcp_servers.statemng]
enabled = true
command = "/bin/sh"
args = ["-c", "exec \"$HOME/.codex/statemng/__PROJECT_NAME__/mcp\""]
required = false
default_tools_approval_mode = "writes"
disabled_tools = ["statemng_task_accept", "statemng_task_unblock"]
